
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <header class="header">
        <div class="logo">文</div>
        <p class="eyebrow">BREAK THE LANGUAGE BARRIER</p>
        <h1>Language <span>Translator</span></h1>
        <p class="subtitle">
            Translate words, sentences and ideas in seconds.
        </p>
    </header>

    <section class="translator-card">

        <!-- Language Selection -->
        <div class="language-row">

            <label class="language-field">
                <span>FROM</span>
                <select id="sourceLanguage">
                    <option value="en" selected>English</option>
                    <option value="hi">Hindi</option>
                    <option value="kn">Kannada</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="ml">Malayalam</option>
                    <option value="mr">Marathi</option>
                    <option value="bn">Bengali</option>
                    <option value="gu">Gujarati</option>
                    <option value="pa">Punjabi</option>
                    <option value="ur">Urdu</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                </select>
            </label>

            <button class="swap" id="swapButton"
                title="Swap languages">
                ⇄
            </button>

            <label class="language-field">
                <span>TO</span>
                <select id="targetLanguage">
                    <option value="kn" selected>Kannada</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="ml">Malayalam</option>
                    <option value="mr">Marathi</option>
                    <option value="bn">Bengali</option>
                    <option value="gu">Gujarati</option>
                    <option value="pa">Punjabi</option>
                    <option value="ur">Urdu</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                </select>
            </label>

        </div>

        <!-- Translation Text Areas -->
        <div class="text-panels">

            <!-- Input -->
            <div class="text-panel">

                <div class="panel-heading">
                    <span>YOUR TEXT</span>
                    <span id="charCount">0 / 5000</span>
                </div>

                <textarea
                    id="inputText"
                    maxlength="5000"
                    placeholder="Type or paste the text you want to translate..."
                ></textarea>

                <div class="panel-actions">
                    <button class="text-action" id="clearButton">
                        Clear text
                    </button>

                    <button class="text-action" id="speakInputButton">
                        🔊 Listen
                    </button>
                </div>

            </div>

            <!-- Output -->
            <div class="text-panel output-panel">

                <div class="panel-heading">
                    <span>TRANSLATION</span>
                    <span id="resultLanguage">RESULT</span>
                </div>

                <div
                    id="outputText"
                    class="output-text placeholder"
                    aria-live="polite"
                >
                    Your translated text will appear here.
                </div>

                <div class="panel-actions">
                    <button class="text-action" id="copyButton">
                        ▢ Copy
                    </button>

                    <button class="text-action" id="speakOutputButton">
                        🔊 Listen
                    </button>
                </div>

            </div>

        </div>

        <!-- Translate Button -->
        <button class="translate-button" id="translateButton">
            <span id="buttonText">Translate text</span>
            <span> →</span>
        </button>

        <!-- Status -->
        <p id="status" class="status" role="status">
            Powered by MyMemory Translation API
        </p>

    </section>

    <footer>
        Simple, fast and clear translation for everyday communication.
    </footer>

</main>

<script src="script.js"></script>

</body>
</html>
